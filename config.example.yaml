# Goose config for Apple fm serve (via fm_tool_proxy on :1977). Copy to ~/.config/goose/config.yaml
GOOSE_PROVIDER: openai
GOOSE_MODEL: system            # the only model id fm serve accepts
OPENAI_HOST: http://127.0.0.1:1977   # proxy; use :1976 to hit fm serve directly (chat-only)
OPENAI_BASE_PATH: v1/chat/completions
GOOSE_CONTEXT_LIMIT: 4096      # or 8192 if `fm`/SDK reports that on your Mac
GOOSE_AUTO_COMPACT_THRESHOLD: 0.8
GOOSE_MODE: auto
extensions:
  developer:
    enabled: true
    type: platform
    name: developer
    display_name: Developer
    description: ''
    bundled: true
    available_tools: [shell]   # only the shell tool -> smallest prompt
  analyze:
    enabled: false
    type: platform
    name: analyze
    display_name: Analyze
    description: ''
    bundled: true
